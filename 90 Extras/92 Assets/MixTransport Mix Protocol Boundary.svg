<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="1010" viewBox="0 0 1740 1010" role="img" aria-labelledby="title"><title id="title">MixTransport to Mix Protocol forward and reverse message flow</title><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#25334a"/></marker></defs><rect width="1740" height="1010" fill="white"/><text x="30" y="50" fill="#25334a" font-family="sans-serif" font-size="30"><tspan x="30" dy="0">MixTransport ↔ Mix Protocol: one forward and one reverse message</tspan></text><text x="30" y="86" fill="#25334a" font-family="sans-serif" font-size="20"><tspan x="30" dy="0">A initiates the session. B is its recipient and the forward path's final Mix hop.</tspan></text><text x="30" y="144" fill="#25334a" font-family="sans-serif" font-size="24"><tspan x="30" dy="0">A · MixTransport</tspan></text><text x="410" y="144" fill="#25334a" font-family="sans-serif" font-size="24"><tspan x="410" dy="0">A · Mix Protocol</tspan></text><text x="1010" y="144" fill="#25334a" font-family="sans-serif" font-size="24"><tspan x="1010" dy="0">B · Mix Protocol</tspan></text><text x="1390" y="144" fill="#25334a" font-family="sans-serif" font-size="24"><tspan x="1390" dy="0">B · MixTransport</tspan></text><text x="30" y="202" fill="#1d6d52" font-family="sans-serif" font-size="22"><tspan x="30" dy="0">FORWARD · A → B</tspan></text><rect x="30" y="225" width="320" height="170" rx="12" fill="#e5f5ed" stroke="#25334a" stroke-width="2"/><text x="46" y="261" fill="#25334a" font-family="sans-serif" font-size="22"><tspan x="46" dy="0">Encode a transport frame</tspan></text><text x="46" y="298" fill="#25334a" font-family="sans-serif" font-size="18"><tspan x="46" dy="0">Connect / OpenStream / Data</tspan><tspan x="46" dy="22.5">SURBs included where needed</tspan><tspan x="46" dy="22.5"></tspan><tspan x="46" dy="22.5">send(destination, service,</tspan><tspan x="46" dy="22.5">     encodedFrame)</tspan></text><rect x="410" y="225" width="320" height="170" rx="12" fill="#e6efff" stroke="#25334a" stroke-width="2"/><text x="426" y="261" fill="#25334a" font-family="sans-serif" font-size="22"><tspan x="426" dy="0">Build and send</tspan></text><text x="426" y="298" fill="#25334a" font-family="sans-serif" font-size="18"><tspan x="426" dy="0">Mix service framing</tspan><tspan x="426" dy="22.5">Padding + Sphinx construction</tspan><tspan x="426" dy="22.5">Sender delay + first-hop write</tspan><tspan x="426" dy="22.5"></tspan><tspan x="426" dy="22.5">Service: MixTransport</tspan></text><rect x="1010" y="225" width="320" height="170" rx="12" fill="#e6efff" stroke="#25334a" stroke-width="2"/><text x="1026" y="261" fill="#25334a" font-family="sans-serif" font-size="22"><tspan x="1026" dy="0">Final-hop delivery</tspan></text><text x="1026" y="298" fill="#25334a" font-family="sans-serif" font-size="18"><tspan x="1026" dy="0">Sphinx processing</tspan><tspan x="1026" dy="22.5">Decode Mix message</tspan><tspan x="1026" dy="22.5">Select registered service</tspan><tspan x="1026" dy="22.5"></tspan><tspan x="1026" dy="22.5">MixDelivery(service, payload)</tspan></text><rect x="1390" y="225" width="320" height="170" rx="12" fill="#e5f5ed" stroke="#25334a" stroke-width="2"/><text x="1406" y="261" fill="#25334a" font-family="sans-serif" font-size="22"><tspan x="1406" dy="0">Decode and dispatch</tspan></text><text x="1406" y="298" fill="#25334a" font-family="sans-serif" font-size="18"><tspan x="1406" dy="0">handleDelivery</tspan><tspan x="1406" dy="22.5">Validate transport frame</tspan><tspan x="1406" dy="22.5">Find session and stream</tspan><tspan x="1406" dy="22.5">Process frame kind</tspan><tspan x="1406" dy="22.5">Store supplied SURBs</tspan></text><line x1="350" y1="310" x2="410" y2="310" stroke="#25334a" stroke-width="2" marker-end="url(#arrow)"/><line x1="730" y1="310" x2="1010" y2="310" stroke="#25334a" stroke-width="2" marker-end="url(#arrow)"/><line x1="1330" y1="310" x2="1390" y2="310" stroke="#25334a" stroke-width="2" marker-end="url(#arrow)"/><text x="755" y="282" fill="#25334a" font-family="sans-serif" font-size="20"><tspan x="755" dy="0">Sphinx via relays</tspan></text><text x="755" y="353" fill="#25334a" font-family="sans-serif" font-size="18"><tspan x="755" dy="0">Not a direct link</tspan></text><text x="30" y="467" fill="#8a4d19" font-family="sans-serif" font-size="22"><tspan x="30" dy="0">REVERSE · B → A · fresh SURBs for every send</tspan></text><rect x="30" y="500" width="320" height="170" rx="12" fill="#fff2df" stroke="#25334a" stroke-width="2"/><text x="46" y="536" fill="#25334a" font-family="sans-serif" font-size="22"><tspan x="46" dy="0">Recover and dispatch</tspan></text><text x="46" y="573" fill="#25334a" font-family="sans-serif" font-size="18"><tspan x="46" dy="0">Lookup credential by reply ID</tspan><tspan x="46" dy="22.5">recoverReply(credential, reply)</tspan><tspan x="46" dy="22.5">Decode transport frame</tspan><tspan x="46" dy="22.5">Check session association</tspan><tspan x="46" dy="22.5">Process snapshot + operation</tspan></text><rect x="410" y="500" width="320" height="170" rx="12" fill="#e6efff" stroke="#25334a" stroke-width="2"/><text x="426" y="536" fill="#25334a" font-family="sans-serif" font-size="22"><tspan x="426" dy="0">Return-packet arrival</tspan></text><text x="426" y="573" fill="#25334a" font-family="sans-serif" font-size="18"><tspan x="426" dy="0">Sphinx processing</tspan><tspan x="426" dy="22.5">RawSurbReply:</tspan><tspan x="426" dy="22.5">  identifier</tspan><tspan x="426" dy="22.5">  encryptedPayload</tspan><tspan x="426" dy="22.5">Invoke raw-reply callback</tspan></text><rect x="1010" y="500" width="320" height="170" rx="12" fill="#e6efff" stroke="#25334a" stroke-width="2"/><text x="1026" y="536" fill="#25334a" font-family="sans-serif" font-size="22"><tspan x="1026" dy="0">Use one SURB</tspan></text><text x="1026" y="573" fill="#25334a" font-family="sans-serif" font-size="18"><tspan x="1026" dy="0">sendWithSurb(surb, payload)</tspan><tspan x="1026" dy="22.5">Empty service identifier</tspan><tspan x="1026" dy="22.5">useSURB → Sphinx packet</tspan><tspan x="1026" dy="22.5">Sender delay + first-hop write</tspan><tspan x="1026" dy="22.5">One call consumes one SURB</tspan></text><rect x="1390" y="500" width="320" height="170" rx="12" fill="#fff2df" stroke="#25334a" stroke-width="2"/><text x="1406" y="536" fill="#25334a" font-family="sans-serif" font-size="22"><tspan x="1406" dy="0">Prepare a reverse frame</tspan></text><text x="1406" y="573" fill="#25334a" font-family="sans-serif" font-size="18"><tspan x="1406" dy="0">Select SURBs for redundancy</tspan><tspan x="1406" dy="22.5">Attach supply snapshot*</tspan><tspan x="1406" dy="22.5">Encode the transport frame</tspan><tspan x="1406" dy="22.5">Same bytes; distinct SURBs</tspan><tspan x="1406" dy="22.5">* ordinary reverse frames</tspan></text><line x1="410" y1="585" x2="350" y2="585" stroke="#25334a" stroke-width="2" marker-end="url(#arrow)"/><line x1="1010" y1="585" x2="730" y2="585" stroke="#25334a" stroke-width="2" marker-end="url(#arrow)"/><line x1="1390" y1="585" x2="1330" y2="585" stroke="#25334a" stroke-width="2" marker-end="url(#arrow)"/><text x="755" y="555" fill="#25334a" font-family="sans-serif" font-size="20"><tspan x="755" dy="0">Sphinx via relays</tspan></text><text x="755" y="628" fill="#25334a" font-family="sans-serif" font-size="18"><tspan x="755" dy="0">Route from SURB</tspan></text><rect x="30" y="740" width="800" height="170" rx="12" fill="#f1edff" stroke="#25334a" stroke-width="2"/><text x="48" y="778" fill="#25334a" font-family="sans-serif" font-size="23"><tspan x="48" dy="0">Before Connect: A asks Mix to create return capacity</tspan></text><text x="48" y="816" fill="#25334a" font-family="sans-serif" font-size="21"><tspan x="48" dy="0">createSurb(B) → (SURB, ReplyCredential)</tspan><tspan x="48" dy="26.25">SURB → serialized into a forward transport frame → B</tspan><tspan x="48" dy="26.25">Credential → stays in A's store, associated with the session</tspan></text><rect x="900" y="740" width="810" height="170" rx="12" fill="#f7f7f7" stroke="#25334a" stroke-width="2"/><text x="918" y="778" fill="#25334a" font-family="sans-serif" font-size="23"><tspan x="918" dy="0">Two different meanings of completion</tspan></text><text x="918" y="816" fill="#25334a" font-family="sans-serif" font-size="21"><tspan x="918" dy="0">Mix send completed: sender hold + first-hop write completed.</tspan><tspan x="918" dy="26.25">Transport ACK: remote transport reports receipt.</tspan><tspan x="918" dy="26.25">MixTransport owns ordering, retries, flow control and supply.</tspan></text><text x="30" y="970" fill="#25334a" font-family="sans-serif" font-size="20"><tspan x="30" dy="0">Application codec selects a stream handler. MixTransport service selects the forward callback. /mix/1.0.0 carries hop-to-hop packets.</tspan></text></svg>
